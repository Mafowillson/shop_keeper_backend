services:
  mongo:
    image: mongo:7
    container_name: shopkeeper_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Not exposed to the host — only the api service needs it

  api:
    image: yourdockerhubusername/shopkeeper-api:latest
    container_name: shopkeeper_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./secrets:/app/secrets
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
